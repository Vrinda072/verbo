# Verbo on Render. Source: render.com/docs/blueprint-spec and render.com/schema/render.yaml.json (read Nov 7, 2026).
# Secrets use `sync: false`: Render asks for each value once in its dashboard, and none of them live in this file.
# Free plans (no card on file). Limits: the web service sleeps after 15 idle minutes, the free Postgres expires after
# 30 days, and Render has no free cron plan, so the hourly reminder job is not defined here (see docs/guides/DEPLOY.md).
# Plan names checked against render.com/docs/blueprint-spec (Nov 12, 2026).
databases:
  - name: verbo-db
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: verbo
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npx next build
    startCommand: npx next start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: MOCK
        value: "1"
      - key: PAYPAL_ENV
        value: sandbox
      - key: LLM_PROVIDER
        value: gemini
      - key: DATABASE_URL
        fromDatabase:
          name: verbo-db
          property: connectionString
      - key: TOKEN_SIGNING_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AG_STUDIO_LICENSE_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: SAz9YHcvj6GT2YYXdXww # River
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: SANDBOX_SENDER_EMAIL
        sync: false
      - key: SANDBOX_INTENDED_RECIPIENT_EMAIL
        sync: false
      - key: SANDBOX_WRONG_RECIPIENT_EMAIL
        sync: false

